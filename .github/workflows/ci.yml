name: CI Pipeline & Live Capacity Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI & Live Capacity Test (Go)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Run Backend Unit & Integration Tests
        run: go test -v -race ./...

      - name: Verify Binary Compilations
        run: |
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/e2e
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/capacity
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/megastress
          CGO_ENABLED=0 go build -v -o /dev/null ./cmd/breakpoint

  frontend-ci:
    name: Frontend CI (Next.js 15)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Verify Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-ci-key"
          NEXT_PUBLIC_API_URL: "https://muhasebe-ve-finans-otomasyonu-2.onrender.com/api/v1"

name: muhasebe_ve_finans_otomasyonu
description: "Defter-i Kebir Muhasebe & Finans Otomasyonu - Kapsamlı Test ve Servis Tanımları"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

# ==============================================================================
# 📊 PROJE TEST SUITE & OTOMASYON TANIMLARI
# ==============================================================================
test_suites:
  accounting_lifecycle:
    config: "tests/accounting_lifecycle_suite.yaml"
    description: "Kasa defteri, gelir/gider, ters kayıt, dönem kilitleme ve devir testleri"
  telegram_alerts:
    package: "deftersystem/backend/pkg/telegram"
    description: "500 ve Panic durumlarında Telegram grubuna saniyelik alarm fırlatma"
  backup_engine:
    package: "deftersystem/backend/pkg/backup"
    description: "Google Drive ve Telegram 3-2-1 otomatik günlük gzip SQL yedeği"
  suppliers_module:
    description: "Tedarikçi ve parçacı carileri borç/alacak yönetimi ve ters kayıt"
  jwt_token_refresh:
    description: "Frontend 401 otomatik token yenileme ve oturum koruma"

# ==============================================================================
# 🚀 CI/CD & DAĞITIM ENTEGRASYONU
# ==============================================================================
deployment:
  backend:
    platform: "render"
    spec: "render.yaml"
  frontend:
    platform: "vercel / next.js 15"
  database:
    platform: "supabase postgresql"
    migration_manager: "backend/cmd/migrate"

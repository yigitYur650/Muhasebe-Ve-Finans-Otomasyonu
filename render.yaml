services:
  # Go Fiber Backend API Service
  - type: web
    name: deftersystem-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

  # Next.js 15 Frontend Web Service
  - type: web
    name: deftersystem-frontend
    env: node
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_EMAIL
        value: admin@oncuotogaz.com
      - key: NEXT_PUBLIC_ADMIN_PASSWORD
        value: oncu123456
